[package]
name = "simpledocs"
version = "1.0.0"
description = "simpledocs.ai floating widget"
authors = ["simpledocs"]
edition = "2021"

[[bin]]
name = "simpledocs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
